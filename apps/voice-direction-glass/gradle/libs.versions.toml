[versions]
agp = "9.2.0"
activity = "1.13.0"
composeBom = "2026.05.00"
kotlin = "2.3.21"
mwdat = "0.7.0"
xrRuntime = "1.0.0-alpha13"
xrProjected = "1.0.0-alpha07"
xrGlimmer = "1.0.0-alpha12"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
junit = { module = "junit:junit", version = "4.13.2" }
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }
xr-runtime = { module = "androidx.xr.runtime:runtime", version.ref = "xrRuntime" }
xr-projected = { module = "androidx.xr.projected:projected", version.ref = "xrProjected" }
xr-glimmer = { module = "androidx.xr.glimmer:glimmer", version.ref = "xrGlimmer" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
